# Same shape as every other standalone here — see rtp-standalone's copy for why each line matters.
name: ${plugin.name}
version: '${plugin.version}'
main: de.raindancer.modules.wrapper.ModulePlugin
bootstrapper: de.raindancer.modules.wrapper.ModuleBootstrap
api-version: '26.3'
description: "Players' own shops: shopkeepers selling from linked stock chests, a server-wide bazaar to trade from afar, reviews and statements."
author: Raindancer118
website: https://github.com/Raindancer118/RainsCore

# A trade runs on the region of the shop it is at; displays are made and moved on theirs too.
folia-supported: true

dependencies:
  bootstrap:
    RainsCore:
      load: BEFORE
      required: true
      join-classpath: true
  server:
    RainsCore:
      load: BEFORE
      required: true
      join-classpath: true
