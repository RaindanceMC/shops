# The serious tone of the shops' wording: the same keys and placeholders, plainly said.
shops:
  only-a-player: "<red>Only players can do that."
  no-such-player: "<red>There is no player called <white><player></white>."
  changed: "<green>Saved."
  removed: "<gray><white><shop></white> was removed. Its chest keeps its stock."
  opened: "<green><white><shop></white> is open."
  repriced: "<green><white><shop></white> has new prices."
  ended-broken: "<gray><white><shop></white> was closed. The chest keeps its stock."
  sign:
    not-on-chest: "<red>A [market] sign must be on a chest, on top of it, or on the block below it."
    unreadable: "<red>The price could not be read.</red> <gray>Second line: <white>10</white> to sell, <white>B 10 S 4</white> to sell and buy. Third line: <white>x16</white> for a bundle."
    no-ware: "<red>Put the item to sell in an item frame on the chest, or in the chest."
  refused:
    closed: "<red>This shop was closed by staff."
    paused: "<yellow>This shop is paused."
    unpaid: "<red>This shop is paused because its rent is unpaid."
    own-shop: "<red>You cannot trade with your own shop."
    out-of-stock: "<red>This shop is sold out."
    shop-full: "<red>This shop's chest is full."
    buy-limit-reached: "<red>This shop is not buying any more of that."
    you-cannot-afford: "<red>You cannot afford that."
    owner-cannot-afford: "<red>The owner cannot pay for that right now."
    your-inventory-full: "<red>Your inventory is full."
    no-economy: "<red>There is no economy on this server."
    busy: "<yellow>This shop is busy. Please try again."
    money-refused: "<red>The payment was refused. Nothing was changed."
    not-a-container: "<red>Only chests, trapped chests and barrels can be shops."
    not-your-land: "<red>You can only set up shops where you may build."
    too-many-shops: "<red>You have reached your chest shop limit."
    price-too-high: "<red>That price is above this server's limit."
    sells-above-buy: "<red>The buying price cannot be above the selling price."
    no-price: "<red>Set a selling or buying price first."
    bad-stars: "<red>Choose one to five stars."
    no-chests: "<red>This shop has no chest any more."
    no-remote: "<red>Buying from afar is switched off. Visit the shop."
    no-remote-selling: "<red>Selling from afar is switched off. Visit the shop."
    too-many-plots: "<red>You have reached your plot limit."
    plot-not-empty: "<red>End the plot's chest shops and empty its chests, frames and stands first."
  market:
    closed: "<red>There is no market world on this server."
    not-yours: "<red>This plot is not yours.</red> <gray>Claim a free plot with <white>/market plot</white>."
    claimed: "<green>Plot <white><plot></white> is yours<gray> (paid: <paid>)</gray>."
  guard:
    not-yours: "<red>This is part of <white><shop></white>. You may not break it."
    not-beside: "<red>That would join the chest of <white><shop></white>."
  travel:
    arrived: "<green>You arrived at <white><shop></white>."
  notice:
    out-of-stock: "<yellow><white><shop></white> is sold out."
    rebuilt: "<gold>Shops have changed:</gold> <gray>your old shop <white><shop></white> is closed; its stock is still in the chest (rent refunded: <gold><amount></gold>). See <white>/market help</white>."
    chest-shops: "<gold>Shops have changed:</gold> <gray>shopkeepers are retired and <white><shop></white> is closed; its stock is still in its chests (rent refunded: <gold><amount></gold>). Chest shops are set up with an item frame and a [market] sign — see <white>/market help</white>."
