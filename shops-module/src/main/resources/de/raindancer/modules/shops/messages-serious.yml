# The serious tone of the shops' wording: the same keys and placeholders, plainly said.
shops:
  only-a-player: "<red>Only players can do that."
  no-such-player: "<red>There is no player called <white><player></white>."
  changed: "<green>Saved."
  removed: "<gray><white><shop></white> was removed. Its chests keep their stock."
  stock-chest: "<gray>That chest is stock of <white><shop></white>. Buy at <white><owner></white>'s shopkeeper or from <white>/bazaar</white>."
  offer:
    added: "<green>Offer <white><shop></white> added. Set a price, link stock chests, then open it."
  link:
    started: "<gold>Linking chests to <white><shop></white>.</gold> <gray>Right click chests within <white><reach></white> blocks of the shopkeeper to link or unlink them. Type <white>/bazaar done</white> to finish."
    done: "<green><white><shop></white> now sells from <white><chests></white> chest(s)."
  refused:
    closed: "<red>This offer was closed by staff."
    paused: "<yellow>This offer is paused."
    unpaid: "<red>This offer is paused because its rent is unpaid."
    own-shop: "<red>You cannot trade with your own shop."
    out-of-stock: "<red>This offer is sold out."
    shop-full: "<red>This offer's stock chests are full."
    buy-limit-reached: "<red>This offer is not buying any more of that."
    you-cannot-afford: "<red>You cannot afford that."
    owner-cannot-afford: "<red>The owner cannot pay for that right now."
    your-inventory-full: "<red>Your inventory is full."
    no-economy: "<red>There is no economy on this server."
    busy: "<yellow>This shop is busy. Please try again."
    money-refused: "<red>The payment was refused. Nothing was changed."
    not-a-container: "<red>Only chests, trapped chests and barrels can hold stock."
    not-your-land: "<red>You can only set up shops where you may build."
    too-many-shops: "<red>You have reached your offer limit."
    price-too-high: "<red>That price is above this server's limit."
    sells-above-buy: "<red>The buying price cannot be above the selling price."
    no-price: "<red>Set a selling or buying price first."
    bad-stars: "<red>Choose one to five stars."
    too-many-stores: "<red>You have reached your shop limit."
    linked-elsewhere: "<red>That chest already holds stock for another offer."
    too-many-chests: "<red>This offer has reached its chest limit."
    no-chests: "<red>This offer has no stock chests yet."
    no-remote: "<red>Buying from afar is switched off. Visit the shopkeeper."
  guard:
    not-yours: "<red>This chest is stock of <white><shop></white>. You may not break it."
    not-beside: "<red>That would join a stock chest of <white><shop></white>."
  store:
    opened: "<green>Shop <white><store></white> set up. Sneak and right click the shopkeeper to add offers."
  travel:
    arrived: "<green>You arrived at <white><shop></white>."
  notice:
    out-of-stock: "<yellow><white><shop></white> is sold out."
    rebuilt: "<gold>Shops have changed:</gold> <gray>your old chest shop <white><shop></white> is closed; its stock is still in the chest (rent refunded: <gold><amount></gold>). Set up a new shop with <white>/bazaar create <name></white>."
