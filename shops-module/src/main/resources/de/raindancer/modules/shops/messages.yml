# Players' shops' wording. Every line can be rewritten in plugins/RainsCore/messages.yml.
shops:
  only-a-player: "<red>A console with a shop. Bold. Players only, though."
  no-such-player: "<red>Nobody called <white><player></white> has ever set foot here."
  changed: "<green>Done. Capitalism thanks you."
  broke: "<red>That went wrong on our side, not yours. Staff can see what happened in the log."
  removed: "<gray><white><shop></white> is off the shelf. Its chest keeps its stock."
  trusted: "<green><white><player></white> now helps at <white><shop></white>."
  opened: "<green><white><shop></white> is open for business. Its sign says what it costs; its item floats over the chest."
  repriced: "<green><white><shop></white> has new prices. Inflation, or a sale?"
  ended-broken: "<gray><white><shop></white> is closed — the chest keeps its stock."
  own-shop: "<gray><white><shop></white> is your own shop. Open the chest to stock it."
  where: "<gray>The chest is at <white><where></white>."
  help: "<gold>Your own chest shop, in three steps:</gold><newline><gray>1. Hang an <white>item frame</white> on a chest and put what you sell in it.<newline><gray>2. Put the stock in the chest.<newline><gray>3. Write a sign on the chest: <white>[market]</white>, then the price — <white>10</white> to sell, <white>B 10 S 4</white> to buy too — then <white>x16</white> for a bundle, then a name if you like.<newline><gray>Sneak and right click the chest with an empty hand to look after it. <white>/market mine</white> lists your shops."

  sign:
    not-on-chest: "<red>A [market] sign goes on a chest — on it, on top of it, or on the block right under it."
    unreadable: "<red>Can't read that price.</red> <gray>Second line: <white>10</white> to sell, <white>B 10 S 4</white> to sell and buy. Third line: <white>x16</white> for a bundle, or empty for one."
    no-ware: "<red>Nothing to sell.</red> <gray>Put the item in an item frame on the chest — or at least in the chest."
    frame-hint: "<gray>Tip: an item frame on the chest shows what you sell, and you can change the item there."
    mark: "<dark_green><bold>✦ Market ✦"
    mark-closed: "<dark_red><bold>✦ Closed ✦"
    both: "<dark_green>B <buy></dark_green><dark_gray> · </dark_gray><dark_red>S <sell>"
    buy: "<dark_green>Buy: <buy>"
    sell: "<dark_red>Buying: <sell>"
    ware: "<black><bundle>× <ware>"
    owner: "<dark_gray><owner>"
    ended: "<dark_gray>[closed]"

  display:
    name: "<gold><bold><shop>"
    buy: "<green>Buy</green> <white><bundle>×</white> <yellow><price>"
    buy-sold-out: "<red>Sold out</red> <dark_gray>(<bundle>× <price>)"
    sell: "<aqua>Sell</aqua> <white><bundle>×</white> <yellow><price>"
    closed: "<red>Closed for now"

  trade:
    bought: "<green>Bought <white><items>× <ware></white> for <gold><amount></gold> at <white><shop></white>."
    sold: "<green>Sold <white><items>× <ware></white> for <gold><amount></gold> to <white><shop></white>."
    trimmed: "<yellow>Not all of it, though: <reason>"

  refused:
    closed: "<red>Staff closed this shop. Whatever it did, it did it well."
    paused: "<yellow>Paused for now. The owner is probably counting coins."
    unpaid: "<red>Paused: its rent is unpaid. The landlord has spoken."
    own-shop: "<red>Trading with your own shop? The only winner would be the server's cut."
    not-selling: "<red>This shop sells nothing. It only buys."
    not-buying: "<red>This shop buys nothing. It only sells."
    out-of-stock: "<red>Sold out. Somebody beat you to it."
    shop-full: "<red>The chest is full. Even shops have limits."
    buy-limit-reached: "<red>The shop has all of that it wants, thanks."
    you-cannot-afford: "<red>You cannot afford that. Have you tried being richer?"
    owner-cannot-afford: "<red>The owner cannot pay for that right now. Awkward."
    your-inventory-full: "<red>Your inventory is full. Make room, then come back."
    you-have-none: "<red>You do not have enough of that to sell."
    no-economy: "<red>There is no economy on this server, so money is purely theoretical."
    busy: "<yellow>Somebody else is trading here this very moment. Try again."
    nothing-asked: "<red>Nothing to do there."
    money-refused: "<red>The bank said no. Nothing was taken, nothing was moved."
    gone: "<red>That shop is gone."
    not-a-container: "<red>That cannot be a shop. Chests, trapped chests and barrels, please."
    already-a-shop: "<red>That chest is already somebody's shop."
    not-your-land: "<red>Not your land. Shops go where you may build."
    too-many-shops: "<red>You have as many chest shops as you may. Retail empires have rules."
    cannot-pay-to-open: "<red>You cannot pay the price of setting up a shop."
    nothing-to-sell: "<red>Nothing to trade: put the item in the chest's item frame."
    bad-name: "<red>That name will not do: too long, empty, or full of strange marks."
    price-too-high: "<red>That price is above what this server allows. Typo with six zeros?"
    sells-above-buy: "<red>Paying more than you ask? People would sell it back to you forever."
    no-price: "<red>Give it a price first — selling, buying, or both."
    not-allowed: "<red>That is not yours to do."
    world-not-allowed: "<red>No shops in this world."
    not-a-customer: "<red>Only somebody who traded there lately may review it."
    review-too-long: "<red>That review is too long, or has odd marks in it."
    bad-stars: "<red>One to five stars. Not six. Not zero."
    not-for-sale: "<red>That item is bound to somebody or insured — it cannot be traded in a shop."
    not-here: "<red>That shop is on another server. Go there first."
    too-far: "<red>Too far: the shop's chest is out of reach from here."
    no-travel: "<red>Travelling to shops is switched off here."
    no-chests: "<red>This shop lost its chest. A shop without a chest is just a sign with ambitions."
    no-remote: "<red>Buying from afar is switched off here — visit the shop's chest."
    no-market: "<red>There is no market world on this server."
    not-a-plot: "<red>That is not a stall plot.</red> <gray>They line the market streets, twelve by twelve."
    plot-taken: "<red>Somebody got here first — this plot is taken."
    too-many-plots: "<red>You have as many plots as you may. Even market barons have limits."
    cannot-pay-for-plot: "<red>You cannot pay for another plot just now."
    not-your-plot: "<red>That plot is not yours."
    plot-not-empty: "<red>Not while something is left on it:</red> <gray>end its chest shops and empty its chests, frames and stands first."

  market:
    closed: "<red>No market world here.</red> <gray>The shops are still all in <white>/market browse</white>."
    welcome: "<gold>Welcome to the market!</gold> <gray>Walk the streets, or claim a stall plot of your own: stand on one and type <white>/market plot</white>."
    not-yours: "<red>Not your plot.</red> <gray>Claim a free one: <white>/market plot</white>."
    claimed: "<green>Plot <white><plot></white> is yours<gray> (paid: <paid>)</gray>. Build your stall and set up chest shops on it."
    released: "<gray>Plot <white><plot></white> is free again, with its empty stall back."
    bar-free: "<green>Free plot</green> <gray>— yours for nothing: <white>/market plot"
    bar-for-sale: "<yellow>Free plot</yellow> <gray>— yours for <white><price></white>: <white>/market plot"
    bar-owned: "<gold><owner></gold><gray>'s stall"
    bar-yours: "<green>Your stall</green> <gray>(<plot>)"
    rotating: "<gold>The market's stalls are moving round…</gold> <gray>a moment, please."
    rotated: "<green>The stalls moved one place round:</green> <gray><count> plot(s)."
    rotate-failed: "<red>The stalls could not move round; nothing was changed. Staff can see why in the log."

  guard:
    not-yours: "<red>That is part of <white><shop></white>, and it is not yours to break."
    not-beside: "<red>That would join <white><shop></white>'s chest. Nice try."

  store:
    closed: "<gray>Every chest shop of <white><store></white> is closed. The chests keep everything in them."
    about: "<gold><store></gold> <gray>by <white><owner></white>"

  review:
    thanks: "<green>Thanks for reviewing <white><shop></white>. The owner will hear about it."
    removed: "<gray>Took down <white><player></white>'s review."
    line: "<gold><stars></gold> <white><player></white><gray>: <text>"

  log:
    line: "<gray><player> — <white><items></white> items, <gold><amount></gold>"


  travel:
    counting: "<gray>Off to <white><shop></white> in <white><seconds></white>…"
    arrived: "<green>Welcome to <white><shop></white>. Wallet ready?"
    cancelled: "<gray>Trip to <white><shop></white> cancelled — you moved. Nothing was charged."
    failed: "<red>Could not get you to <white><shop></white>. Nothing was charged."

  notice:
    while-away: "<gold>While you were away, at your shops:"
    summary-sold: "<gray> · <white><trades></white> sales, <white><items></white> items, <green>+<amount>"
    summary-bought: "<gray> · <white><trades></white> purchases, <white><items></white> items, <red>-<amount>"
    and-more: "<gray> · and <white><count></white> more, in each shop's log."
    sold: "<green><who> bought <white><items></white> at <white><shop></white>: <gold>+<amount>"
    bought: "<aqua><who> sold you <white><items></white> at <white><shop></white>: <gold>-<amount>"
    out-of-stock: "<yellow><white><shop></white> is sold out. Customers are sad."
    low-stock: "<yellow><white><shop></white> is running low: <white><items></white> left."
    full: "<yellow><white><shop></white>'s chests are full; it cannot buy any more."
    cannot-afford: "<yellow><white><who></white> wanted to sell to <white><shop></white>, but you could not pay <gold><amount></gold>."
    reviewed: "<gold><who></gold> <gray>gave <white><shop></white> <white><items></white> stars."
    rent-paid: "<gray>Rent for <white><shop></white> paid: <gold><amount></gold>."
    unpaid: "<red><white><shop></white> paused: you could not pay its rent of <gold><amount></gold>. Pay it in the shop's back room."
    closed: "<red>Staff (<white><who></white>) closed your shop <white><shop></white>."
    reopened: "<green>Staff (<white><who></white>) reopened your shop <white><shop></white> — open it in its back room."
    removed: "<red>Staff (<white><who></white>) removed <white><shop></white>. Its stock is still in its chest."
    rebuilt: "<gold>Shops work differently now:</gold> <gray>your old shop <white><shop></white> is closed and its stock is still in the chest (rent given back: <gold><amount></gold>). Set up a new one: <white>/market help</white>."
    plot-moved: "<gold>Your stall moved round:</gold> <gray>it is now plot <white><shop></white>, <white><items></white> blocks from the square. <white>/market home</white> takes you there."
    chest-shops: "<gold>Shopkeepers are retired — a chest is the shop now:</gold> <gray><white><shop></white> is closed, its stock still in its chests (rent given back: <gold><amount></gold>). Hang an item frame on a chest and write a <white>[market]</white> sign: <white>/market help</white>."
