# Players' shops' wording. Every line can be rewritten in plugins/RainsCore/messages.yml.
shops:
  only-a-player: "<red>Only players can do that."
  no-such-player: "<red>There is no player called <white><player></white>."
  changed: "<green>Saved."
  broke: "<red>Something went wrong. Staff can see what happened in the log."
  removed: "<gray><white><shop></white> was removed. Its chest keeps its stock."
  trusted: "<green><white><player></white> now helps at <white><shop></white>."
  opened: "<green><white><shop></white> is open. The sign shows the price and the item floats over the chest."
  repriced: "<green><white><shop></white> has new prices."
  ended-broken: "<gray><white><shop></white> was closed. The chest keeps its stock."
  own-shop: "<gray><white><shop></white> is your own shop. Open the chest to stock it."
  where: "<gray>The chest is at <white><where></white>."
  help: "<gold>Set up a chest shop in three steps:</gold><newline><gray>1. Hang an <white>item frame</white> on a chest and put what you sell in it.<newline><gray>2. Put the stock in the chest.<newline><gray>3. Write a sign on the chest: <white>[market]</white>, then the price (<white>10</white> to sell, <white>B 10 S 4</white> to buy too), then <white>x16</white> for a bundle, then a name if you like.<newline><gray>Sneak and right click the chest with an empty hand to look after it. <white>/market mine</white> lists your shops."

  sign:
    not-on-chest: "<red>A [market] sign must be on a chest, on top of it, or on the block below it."
    unreadable: "<red>The price could not be read.</red> <gray>Second line: <white>10</white> to sell, <white>B 10 S 4</white> to sell and buy. Third line: <white>x16</white> for a bundle, or empty for one."
    no-ware: "<red>Nothing to sell.</red> <gray>Put the item in an item frame on the chest, or at least in the chest."
    frame-hint: "<gray>Tip: an item frame on the chest shows what you sell, and you can change the item there."
    mark: "<dark_green><bold>✦ Market ✦"
    mark-closed: "<dark_red><bold>✦ Closed ✦"
    both: "<dark_green>B <buy></dark_green><dark_gray> · </dark_gray><dark_red>S <sell>"
    buy: "<dark_green>Buy: <buy>"
    sell: "<dark_red>Buying: <sell>"
    ware: "<black><bundle>× <ware>"
    owner: "<dark_gray><owner>"
    ended: "<dark_gray>[closed]"

  display:
    name: "<gold><bold><shop>"
    buy: "<green>Buy</green> <white><bundle>×</white> <yellow><price>"
    buy-sold-out: "<red>Sold out</red> <dark_gray>(<bundle>× <price>)"
    sell: "<aqua>Sell</aqua> <white><bundle>×</white> <yellow><price>"
    closed: "<red>Closed"

  trade:
    bought: "<green>Bought <white><items>× <ware></white> for <gold><amount></gold> at <white><shop></white>."
    sold: "<green>Sold <white><items>× <ware></white> for <gold><amount></gold> to <white><shop></white>."
    trimmed: "<yellow>Not all of it: <reason>"

  refused:
    closed: "<red>This shop was closed by staff."
    paused: "<yellow>This shop is paused."
    unpaid: "<red>This shop is paused because its rent is unpaid."
    own-shop: "<red>You cannot trade with your own shop."
    not-selling: "<red>This shop sells nothing. It only buys."
    not-buying: "<red>This shop buys nothing. It only sells."
    out-of-stock: "<red>This shop is sold out."
    shop-full: "<red>This shop's chest is full."
    buy-limit-reached: "<red>This shop is not buying any more of that."
    you-cannot-afford: "<red>You cannot afford that."
    owner-cannot-afford: "<red>The owner cannot pay for that right now."
    your-inventory-full: "<red>Your inventory is full. Make room and try again."
    you-have-none: "<red>You do not have enough of that to sell."
    no-economy: "<red>There is no economy on this server."
    busy: "<yellow>Somebody else is trading here. Try again."
    nothing-asked: "<red>Nothing to do there."
    money-refused: "<red>The payment was refused. Nothing was changed."
    gone: "<red>That shop is gone."
    not-a-container: "<red>Only chests, trapped chests and barrels can be shops."
    already-a-shop: "<red>That chest is already somebody's shop."
    not-your-land: "<red>You can only set up shops where you may build."
    too-many-shops: "<red>You have reached your chest shop limit."
    cannot-pay-to-open: "<red>You cannot pay the price of setting up a shop."
    nothing-to-sell: "<red>Nothing to trade: put the item in the chest's item frame."
    bad-name: "<red>That name will not do: empty, longer than <most> characters, or full of strange marks."
    price-too-high: "<red>That price is above this server's limit."
    sells-above-buy: "<red>The buying price cannot be above the selling price."
    no-price: "<red>Set a selling or buying price first."
    not-allowed: "<red>That is not yours to do."
    world-not-allowed: "<red>No shops in this world."
    not-a-customer: "<red>Only somebody who traded there in the last <days> days may review it.</red> <gray>Buy or sell something first."
    review-too-long: "<red>That review is too long, or has odd marks in it.</red> <gray>Up to <most> characters."
    bad-stars: "<red>Choose one to five stars."
    not-for-sale: "<red>That item is bound to a player or insured, so it cannot be traded in a shop."
    not-here: "<red>That shop is on another server. Go there first."
    too-far: "<red>Too far: the shop's chest is out of reach from here."
    no-travel: "<red>Travelling to shops is switched off here."
    no-chests: "<red>This shop has no chest any more."
    no-remote: "<red>Buying from afar is switched off here. Visit the shop's chest."
    no-remote-selling: "<red>Selling from afar is switched off here. Bring the item to the shop's chest."
    no-market: "<red>There is no market world on this server."
    not-a-plot: "<red>That is not a stall plot.</red> <gray>They line the market streets, twelve by twelve."
    plot-taken: "<red>This plot is already taken."
    too-many-plots: "<red>You have reached your plot limit."
    cannot-pay-for-plot: "<red>You cannot pay for another plot."
    not-your-plot: "<red>That plot is not yours."
    plot-not-empty: "<red>Not while something is left on it:</red> <gray>end its chest shops and empty its chests, frames and stands first."

  usage:
    admin: "<red>Unknown option.</red> <gray>Try <white>/market admin</white> for every shop here, or <white>/market admin rotate</white> to move the stalls."

  market:
    home: "<gray>Going to your stall, plot <white><plot></white>."
    closed: "<red>There is no market world here.</red> <gray>All shops are listed in <white>/market browse</white>."
    welcome: "<gold>Welcome to the market.</gold> <gray>To claim a stall plot, stand on it and type <white>/market plot</white>."
    not-yours: "<red>Not your plot.</red> <gray>Claim a free one: <white>/market plot</white>."
    claimed: "<green>Plot <white><plot></white> is yours<gray> (paid: <paid>)</gray>. Build your stall and set up chest shops on it."
    released: "<gray>Plot <white><plot></white> is free again, with its empty stall back."
    bar-free: "<green>Free plot</green><gray>: free to claim with <white>/market plot"
    bar-for-sale: "<yellow>Free plot</yellow><gray>: <white><price></white> with <white>/market plot"
    bar-owned: "<gold><owner></gold><gray>'s stall"
    bar-yours: "<green>Your stall</green> <gray>(<plot>)"
    rotating: "<gold>The market's stalls are moving round.</gold> <gray>This takes a moment."
    rotated: "<green>The stalls moved one place round:</green> <gray><count> plot(s)."
    rotate-failed: "<red>The stalls could not move round. Nothing was changed. Staff can see why in the log."

  guard:
    not-yours: "<red>This is part of <white><shop></white>. You may not break it."
    not-beside: "<red>That would join the chest of <white><shop></white>."

  store:
    closed: "<gray>Every chest shop of <white><store></white> is closed. The chests keep everything in them."
    about: "<gold><store></gold> <gray>by <white><owner></white>"

  review:
    thanks: "<green>Thanks for reviewing <white><shop></white>. The owner will be told."
    removed: "<gray>Took down <white><player></white>'s review."
    line: "<gold><stars></gold> <white><player></white><gray>: <text>"

  log:
    line: "<gray><player>: <white><items></white> items, <gold><amount></gold>"


  travel:
    counting: "<gray>Going to <white><shop></white> in <white><seconds></white>."
    cancelled: "<gray>Trip to <white><shop></white> cancelled because you moved. Nothing was charged."
    failed: "<red>Could not get you to <white><shop></white>. Nothing was charged."

  notice:
    while-away: "<gold>While you were away, at your shops:"
    summary-sold: "<gray> · <white><trades></white> sales, <white><items></white> items, <green>+<amount>"
    summary-bought: "<gray> · <white><trades></white> purchases, <white><items></white> items, <red>-<amount>"
    and-more: "<gray> · and <white><count></white> more, in each shop's log."
    sold: "<green><who> bought <white><items></white> at <white><shop></white>: <gold>+<amount>"
    bought: "<aqua><who> sold you <white><items></white> at <white><shop></white>: <gold>-<amount>"
    out-of-stock: "<yellow><white><shop></white> is sold out."
    low-stock: "<yellow><white><shop></white> is running low: <white><items></white> left."
    full: "<yellow><white><shop></white>'s chests are full; it cannot buy any more."
    cannot-afford: "<yellow><white><who></white> wanted to sell to <white><shop></white>, but you could not pay <gold><amount></gold>."
    reviewed: "<gold><who></gold> <gray>gave <white><shop></white> <white><items></white> stars."
    rent-paid: "<gray>Rent for <white><shop></white> paid: <gold><amount></gold>."
    unpaid: "<red><white><shop></white> paused: you could not pay its rent of <gold><amount></gold>. Pay it in the shop's back room."
    closed: "<red>Staff (<white><who></white>) closed your shop <white><shop></white>."
    reopened: "<green>Staff (<white><who></white>) reopened your shop <white><shop></white>. Open it in its back room."
    removed: "<red>Staff (<white><who></white>) removed <white><shop></white>. Its stock is still in its chest."
    rebuilt: "<gold>Shops have changed:</gold> <gray>your old shop <white><shop></white> is closed. Its stock is still in the chest (rent refunded: <gold><amount></gold>). To set up a new one, see <white>/market help</white>."
    plot-moved: "<gold>Your stall moved:</gold> <gray>it is now plot <white><shop></white>, <white><items></white> blocks from the square. <white>/market home</white> takes you there."
    chest-shops: "<gold>Shops have changed:</gold> <gray>shopkeepers are gone and <white><shop></white> is closed. Its stock is still in its chests (rent refunded: <gold><amount></gold>). Chest shops need an item frame and a <white>[market]</white> sign, see <white>/market help</white>."
