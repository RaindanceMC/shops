# Players' shops' wording. Every line can be rewritten in plugins/RainsCore/messages.yml.
shops:
  only-a-player: "<red>A console with a shop. Bold. Players only, though."
  no-such-player: "<red>Nobody called <white><player></white> has ever set foot here."
  changed: "<green>Done. Capitalism thanks you."
  broke: "<red>That went wrong on our side, not yours. Staff can see what happened in the log."
  removed: "<gray><white><shop></white> is off the shelf. Its chests keep their stock."
  trusted: "<green><white><player></white> now helps at <white><shop></white>."
  how-to-open: "<gray>Stand where your shopkeeper should be and type <white>/bazaar create <name></white>. Then sneak and right click them to add offers."
  stock-chest: "<gray>That is <white><shop></white>'s stock. Buy at <white><owner></white>'s shopkeeper — or from <white>/bazaar</white>."

  offer:
    added: "<green>New offer: <white><shop></white>. Give it a price, link its stock chests, then open it."

  link:
    started: "<gold>Linking chests to <white><shop></white>.</gold> <gray>Right click chests within <white><reach></white> blocks of your shopkeeper — again to unlink. <white>/bazaar done</white> when finished."
    linked: "<green>Linked to <white><shop></white> <gray>(<chests>/<most> chests)."
    unlinked: "<gray>Unlinked from <white><shop></white> <gray>(<chests>/<most> chests)."
    unlinked-broken: "<gray>That chest was <white><shop></white>'s stock — not any more."
    done: "<green><white><shop></white> sells from <white><chests></white> chest(s)."
    not-linking: "<gray>You are not linking any chests right now."
    where: "<gray>A stock chest at <white><where></white>"

  trade:
    bought: "<green>Bought <white><items>× <ware></white> for <gold><amount></gold> at <white><shop></white>."
    sold: "<green>Sold <white><items>× <ware></white> for <gold><amount></gold> to <white><shop></white>."
    trimmed: "<yellow>Not all of it, though: <reason>"

  refused:
    closed: "<red>Staff closed this offer. Whatever it did, it did it well."
    paused: "<yellow>Paused for now. The owner is probably counting coins."
    unpaid: "<red>Paused: its rent is unpaid. The landlord has spoken."
    own-shop: "<red>Trading with your own shop? The only winner would be the server's cut."
    not-selling: "<red>This offer sells nothing. It only buys."
    not-buying: "<red>This offer buys nothing. It only sells."
    out-of-stock: "<red>Sold out. Somebody beat you to it."
    shop-full: "<red>The stock chests are full. Even shops have limits."
    buy-limit-reached: "<red>The shop has all of that it wants, thanks."
    you-cannot-afford: "<red>You cannot afford that. Have you tried being richer?"
    owner-cannot-afford: "<red>The owner cannot pay for that right now. Awkward."
    your-inventory-full: "<red>Your inventory is full. Make room, then come back."
    you-have-none: "<red>You do not have enough of that to sell."
    no-economy: "<red>There is no economy on this server, so money is purely theoretical."
    busy: "<yellow>Somebody else is trading here this very moment. Try again."
    nothing-asked: "<red>Nothing to do there."
    money-refused: "<red>The bank said no. Nothing was taken, nothing was moved."
    gone: "<red>That offer is gone."
    not-a-container: "<red>That cannot hold stock. Chests, trapped chests and barrels, please."
    already-a-shop: "<red>That chest already belongs to an offer."
    not-your-land: "<red>Not your land. Shops go where you may build."
    too-many-shops: "<red>You have as many offers as you may. Retail empires have rules."
    cannot-pay-to-open: "<red>You cannot pay the price of setting up a shop."
    nothing-to-sell: "<red>Hold the item it should trade first."
    bad-name: "<red>That name will not do: too long, empty, or full of strange marks."
    price-too-high: "<red>That price is above what this server allows. Typo with six zeros?"
    sells-above-buy: "<red>Paying more than you ask? People would sell it back to you forever."
    no-price: "<red>Give it a price first — selling, buying, or both."
    not-allowed: "<red>That is not yours to do."
    world-not-allowed: "<red>No shops in this world."
    not-a-customer: "<red>Only somebody who traded there lately may review it."
    review-too-long: "<red>That review is too long, or has odd marks in it."
    bad-stars: "<red>One to five stars. Not six. Not zero."
    not-for-sale: "<red>That item is bound to somebody or insured — it cannot be traded in a shop."
    too-many-stores: "<red>You have as many shops as you may."
    last-store: "<red>That is your last shop."
    too-many-statues: "<red>That shop already has its shopkeeper."
    no-statues: "<red>Shopkeepers are switched off on this server."
    not-here: "<red>That shop is on another server. Go there first."
    too-far: "<red>Too far: the shop's stock chests are out of reach from here."
    no-travel: "<red>Travelling to shops is switched off here."
    linked-elsewhere: "<red>That chest is already stock of another offer — or the other half of it is."
    too-many-chests: "<red>That offer has as many chests as it may. Unlink one first."
    too-many-offers: "<red>That shop has as many offers as it may."
    no-chests: "<red>This offer has no stock chests yet. Link some in its back room."
    no-remote: "<red>Buying from afar is switched off here — visit the shopkeeper."

  guard:
    not-yours: "<red>That is <white><shop></white>'s stock, and it is not yours to break."
    not-beside: "<red>That would join <white><shop></white>'s stock chest. Nice try."

  keeper:
    name: "<gold><store>"
    motto: "<gray><motto>"
    no-motto: "<gray>Click to shop"
    moved: "<green>The shopkeeper of <white><store></white> now stands here."
    closed: "<red>This shopkeeper's shop has closed. They will be gone soon."

  store:
    opened: "<green><white><store></white> is open — your shopkeeper stands here. Sneak and right click them to add offers."
    closed: "<gray><white><store></white> is closed. Its chests keep everything in them."
    about: "<gold><store></gold> <gray>by <white><owner></white>"

  review:
    thanks: "<green>Thanks for reviewing <white><shop></white>. The owner will hear about it."
    removed: "<gray>Took down <white><player></white>'s review."
    line: "<gold><stars></gold> <white><player></white><gray>: <text>"

  log:
    line: "<gray><player> — <white><items></white> items, <gold><amount></gold>"

  prompt:
    busy: "<red>You are already being asked something. Answer that first."
    buy-price: "<yellow>Type the selling price per bundle in chat — 0 to stop selling, a dash to keep it."
    sell-price: "<yellow>Type the buying price per bundle in chat — 0 to stop buying, a dash to keep it."
    name: "<yellow>Type the offer's new name in chat, or a dash to keep it."
    store-name: "<yellow>Type the shop's name in chat, or a dash to give up."
    motto: "<yellow>Type the shop's motto in chat; a dash clears it."
    review: "<yellow>Type your review in chat — or a dash for stars only."
    search: "<yellow>Type what you are looking for — or a dash for everything."
    not-money: "<red><white><typed></white> is not an amount of money. Try 12, 1.5k or 0."

  travel:
    counting: "<gray>Off to <white><shop></white> in <white><seconds></white>…"
    arrived: "<green>Welcome to <white><shop></white>. Wallet ready?"
    cancelled: "<gray>Trip to <white><shop></white> cancelled — you moved. Nothing was charged."
    failed: "<red>Could not get you to <white><shop></white>. Nothing was charged."

  notice:
    while-away: "<gold>While you were away, at your shops:"
    summary-sold: "<gray> · <white><trades></white> sales, <white><items></white> items, <green>+<amount>"
    summary-bought: "<gray> · <white><trades></white> purchases, <white><items></white> items, <red>-<amount>"
    and-more: "<gray> · and <white><count></white> more, in each offer's log."
    sold: "<green><who> bought <white><items></white> at <white><shop></white>: <gold>+<amount>"
    bought: "<aqua><who> sold you <white><items></white> at <white><shop></white>: <gold>-<amount>"
    out-of-stock: "<yellow><white><shop></white> is sold out. Customers are sad."
    low-stock: "<yellow><white><shop></white> is running low: <white><items></white> left."
    full: "<yellow><white><shop></white>'s chests are full; it cannot buy any more."
    cannot-afford: "<yellow><white><who></white> wanted to sell to <white><shop></white>, but you could not pay <gold><amount></gold>."
    reviewed: "<gold><who></gold> <gray>gave <white><shop></white> <white><items></white> stars."
    rent-paid: "<gray>Rent for <white><shop></white> paid: <gold><amount></gold>."
    unpaid: "<red><white><shop></white> paused: you could not pay its rent of <gold><amount></gold>. Pay it in the offer's back room."
    closed: "<red>Staff (<white><who></white>) closed your offer <white><shop></white>."
    reopened: "<green>Staff (<white><who></white>) reopened your offer <white><shop></white> — open it in its back room."
    removed: "<red>Staff (<white><who></white>) removed <white><shop></white>. Its stock is still in its chests."
    rebuilt: "<gold>Shops work differently now:</gold> <gray>your old chest shop <white><shop></white> is closed and its stock is still in the chest (rent given back: <gold><amount></gold>). Set up a shop with a shopkeeper: <white>/bazaar create <name></white>."
